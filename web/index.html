<div id="toast" role="status" class="toast" hidden></div><dialog id="guide"><div class="dialog-head"><h2>使用指南</h2><button class="quiet" id="closeGuide" aria-label="关闭">×</button></div><p>TeacherLens 是一个教师评价协作原型。公开版使用人工构造的阅读理解样本和离线规则引擎，并非真实 AI 评分。</p><ol><li>进入评阅任务，查看作业与评分标准。</li><li>确认两个边界案例，生成本次任务规则。</li><li>运行初评，逐份核对作答证据，保存教师确认。</li><li>完成后导出确认记录，或进入评测实验室查看同源对照。</li></ol><p class="muted">模拟任务进度保存在当前浏览器标签页，刷新后可恢复；关闭标签页或重置任务将清空。请勿输入真实学生资料。候选规则不会自动生效。</p><button class="primary" id="guideDone">知道了</button></dialog>
